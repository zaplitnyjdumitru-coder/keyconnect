name: Сборка установщиков

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: pip install pyinstaller pillow
      - name: Иконка
        run: python make_icon.py
      - name: Скачать Xray-core
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip -OutFile xray.zip
          Expand-Archive xray.zip -DestinationPath xray-bin
      - name: Сборка программы
        run: >
          pyinstaller --noconfirm --onedir --windowed --name KeyConnect --icon icon.ico
          --add-data "icon.png;."
          --add-binary "xray-bin/xray.exe;xray"
          --add-data "xray-bin/geoip.dat;xray"
          --add-data "xray-bin/geosite.dat;xray"
          main.py
      - name: Сборка установщика
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: KeyConnect-Windows
          path: Output/KeyConnect-Setup.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pillow
      - run: python make_icon.py
      - name: Скачать Xray-core
        run: |
          curl -fsSL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-macos-arm64-v8a.zip
          unzip -q xray.zip -d xray-bin && chmod +x xray-bin/xray
      - name: Сборка программы
        run: >
          pyinstaller --noconfirm --windowed --name KeyConnect --icon icon.icns
          --osx-bundle-identifier app.keyconnect
          --add-data "icon.png:."
          --add-binary "xray-bin/xray:xray"
          --add-data "xray-bin/geoip.dat:xray"
          --add-data "xray-bin/geosite.dat:xray"
          main.py
      - name: Образ .dmg
        run: |
          mkdir dmg && cp -R dist/KeyConnect.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname KeyConnect -srcfolder dmg -ov -format UDZO KeyConnect-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: KeyConnect-macOS
          path: KeyConnect-macOS.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: KeyConnect ${{ env.VERSION }}
          make_latest: true
          files: |
            KeyConnect-Setup.exe
            KeyConnect-macOS.dmg
